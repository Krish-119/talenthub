<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>TalentHub Frontend</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        .candidate {border: 1px solid #aaa; padding: 0.5rem; margin: 0.5rem 0;}
    </style>
</head>
<body>
    <h1>TalentHub Demo</h1>
    <h2>Add Candidate</h2>
    <form id="candidateForm">
        <label>ID: <input type="number" name="id" required /></label><br/>
        <label>Name: <input type="text" name="name" required /></label><br/>
        <label>Role: <input type="text" name="role" required /></label><br/>
        <label>Years Experience: <input type="number" name="experience_years" required /></label><br/>
        <button type="submit">Add</button>
    </form>
    <h2>Candidates</h2>
    <div id="candidatesList"></div>
    <script>
        const apiBase = "http://127.0.0.1:8001"; // talenthub backend port
        async function loadCandidates(){
            const resp = await fetch(`${apiBase}/candidates`);
            const data = await resp.json();
            const container = document.getElementById('candidatesList');
            container.innerHTML='';
            data.forEach(c=>{
                const div=document.createElement('div');
                div.className='candidate';
                div.textContent=`#${c.id} ${c.name} - ${c.role} (${c.experience_years} yr)`;
                container.appendChild(div);
            });
        }
        document.getElementById('candidateForm').addEventListener('submit', async e=>{
            e.preventDefault();
            const form=e.target;
            const fd=new FormData(form);
            const payload={};
            fd.forEach((v,k)=>payload[k]=k==='id'||k==='experience_years'?Number(v):v);
            await fetch(`${apiBase}/candidates`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            form.reset();
            loadCandidates();
        });
        loadCandidates();
    </script>
</body>
</html>
